# Splat Racer engine settings.
#
# Read at startup: `splat-racer --config engine.conf`. Paths are relative to the repository root.
# Change a value at runtime from the agent console with `set section.key value`, or `dump` the active config.
# Unknown keys are errors, and each error names its line.
#
# Types: numbers, true/false, text (quotes optional), and vec3 written `x y z` or `x,y,z`.

[engine]
tick_hz = 60                    # fixed simulation rate; physics steps once per tick
log_file = logs/engine.log      # JSON lines, one record per line; empty path disables the file
log_level = info                # trace | debug | info | warn | error
log_memory_lines = 500          # records kept in memory for the console `logs` command

[window]
width = 1280
height = 720
title = Splat Racer
vsync = true

[render]
background = hdri               # hdri (sky from the environment map) | black
exposure = 1.0                  # linear exposure multiplier applied to the sky before tone mapping
frame_pacing = auto             # frames shown for a steady number of display refreshes: auto (what the GPU holds), 60, 30, off
debug_lod_boxes = false         # debug: draw the streamed level's octree leaves, coloured by LOD (0 green, 1 yellow, 2 orange, 3 red); B toggles
debug_colliders = false         # debug: draw the voxel collision around the car (floor grid cyan, wall boxes magenta); C toggles
car_cutout = true               # cut a hole through walls and posts between the camera and the car, so it is always seen
car_cutout_radius_m = 2.0       # the hole's radius around the car (its edge dissolves a little beyond)
car_cutout_floor_m = 0.3        # the road and anything this low above the car's underside is never cut
car_cutout_soft = 1.35          # the hole's edge dissolves out to this many times its radius
car_cutout_splat_reach_m = 0.25 # widens the hole for splats near the camera (they look large on screen)
car_cutout_depth_margin_m = 0.5 # only splats at least this much closer to the camera than the car are cut

[camera]
fov_degrees = 50                # vertical field of view
reverse_swing = true            # reversing swings the chase camera round to look the way the car is going
follow_distance_m = 6           # chase camera: distance behind the car
follow_height_m = 1.8           # chase camera: height above the car
follow_look_height_m = 0.8      # chase camera: the point it looks at, above the car's centre
follow_position_damping = 6     # chase camera: how quickly it catches up (higher is stiffer)
follow_look_damping = 10        # chase camera: how quickly its aim catches up
follow_velocity_heading_mps = 2 # above this speed the camera follows the direction of travel (so it swings into slides)
follow_max_pitch_degrees = 69   # how far the mouse can tilt the chase camera up or down
near = 0.01
far = 1000

[splat]
path = assets/car/porsche-992-gt3rs-2023.sog
rotate_x_degrees = 180          # the scan is Y-down; flip it upright

[hdri]
path = assets/hdri/studio_sun.hdr  # equirectangular Radiance .hdr (2:1); empty uses the procedural sky
face_size = 512                 # cubemap face resolution in texels
rotation_degrees = 0            # spin the environment around the vertical axis
procedural_sun = 0.4 0.7 0.5    # sun direction for the procedural sky (need not be normalised)

[physics]
gravity = 0 -9.81 0
substeps = 2                    # rapier steps per tick; more is stabler and slower
voxel_size = 0.05               # collider cell size in splat units (metres if the scan is metric)
ground = true
ground_y = 0.0
ground_half_extent = 100
friction = 0.8
restitution = 0.1
ccd = true                      # continuous collision detection for the fast-moving car

[level]
path = levels/saburi-alley-yazd        # streamed level; its collision voxels become the floor. Empty keeps the ground plane.
floor_clearance_m = 2.0         # air needed above a floor cell for it to count as walkable
stream = true                   # stream levels of detail: LOD 0 near the camera, coarser further away
lod_error_px = 1.5              # streaming: each leaf gets the coarsest LOD whose splats land at most this many pixels apart (1080p)
lod_distance_m = 24             # streaming: with lod_error_px = 0, LOD 0 reaches this far and each coarser LOD doubles it
pool_splats = 0                 # streaming: splats on the GPU at once; 0 sizes it to the level (80% of its finest LOD, 3M-8M)
max_distance_m = 150            # streaming: leaves beyond this are not drawn
uploads_per_frame = 200000      # streaming: splats re-encoded and uploaded per frame (higher fills in faster, lower hitches less)
behind_lod_bias = 1             # streaming: leaves out of view (behind or to the side) drop this many levels of detail
sh_lods = 1                     # streaming: levels of detail finer than this keep their spherical harmonics (7 palettes fit; 1 keeps them for LOD 0)
cache_chunks = 8                # streaming: decoded chunk files kept after use (besides those prefetched for leaves ahead)
chunks_in_flight = 3            # streaming: chunk files fetched at once
lod_fade_s = 0.35               # streaming: a leaf changing level of detail crossfades over this long (0 pops)
lod_keep_s = 1.5                # streaming: a leaf keeps its detail this long before going coarser (glances, budget dips)
lod_centre = car                # streaming: detail is finest around the car (steady as the chase camera swings), or `camera`
lod_any_view_m = 8              # streaming: within this of the car, leaves keep their detail whichever way the camera looks
collision_tile_m = 16           # collision streams in square tiles this size...
collision_radius_m = 32         # ...built within this distance of the car (dropped beyond 1.5x)
floor_smooth_m = 1.0            # road smoothing: cobbles, scan noise and voxel steps are averaged over this radius...
floor_step_keep_m = 0.12        # ...except across height changes bigger than this (kerbs, steps), which keep their edge
floor_mesh_m = 0.4              # the smoothed floor becomes a continuous surface with a point every this many metres
lod = auto                      # without streaming: the one level of detail to draw; auto picks the finest within max_splats
max_splats = 3000000            # without streaming: splat budget for lod = auto
rotate_z_degrees = 180          # level splats are stored y-down; this turns them into the voxels' y-up space
walls = true                    # facades, posts and planters from the voxels become collision boxes
wall_height_m = 3.0             # how tall the wall boxes are above the road

[live]
frame_dir = logs/live           # the window writes frame.png here; served over HTTP for browser viewing
interval_s = 1.0

[vehicle]
mass_kg = 0                     # 0 uses the car spec's mass (1,450 kg for the GT3 RS); a positive value overrides it
forward_degrees = 180           # where the nose points in the car's own frame, about Y from +Z (the chase camera sits behind it)
length_m = 4.57                 # the car is scaled so its body is this long (a 992 GT3 RS is 4.57 m); 0 keeps the splat's units
spec = crates/splat-car/specs/porsche-992-gt3rs.car   # the car's engine, gearbox, tyres, aero (edit, then reload)
hull_clearance_m = 0.25         # the body's collider starts this far above the tyres, so it clears kerbs
hull_friction = 0.02            # the body slides on walls and kerbs; the tyres do the gripping
wall_slide = 0.6                # 0..1: a car touching a wall turns towards its line and its tyres ease, so it glances off
suspension_sag_m = 0.07         # static sag (sets spring stiffness; ~1.9 Hz ride)
suspension_rest_m = 0.25        # suspension length unloaded
damping_compression = 0.5       # share of critical damping
damping_rebound = 0.8
anti_squat = 0.5                # share of launch pitch taken by the suspension geometry
anti_dive = 0.5                 # share of braking pitch taken by the suspension geometry
spawn = 0 0.5 0                 # fallback spawn when there is no level; with a level the car spawns on the road

[effects]
enabled = true
speed_ref_kmh = 250             # the speed at which every speed-sensitive effect is at full strength
shake_m = 0.035                 # camera shake at full speed, metres (grows with the square of speed)
dezoom_fov_degrees = 12         # extra field of view at full speed
dezoom_m = 1.2                  # how far the chase camera drops back at full speed
blur = 0.6                      # peripheral (radial) motion blur at full speed, 0..1
fringe = 0.006                  # colour fringing (chromatic aberration) at the screen edge at full speed
grain = 0.035                   # film grain (noise) strength, always on
grade = 0.8                     # Hollywood colour grade (teal shadows, warm highlights, filmic contrast), 0..1
grade_contrast = 0.55           # grade: filmic S-curve mix, 0..1
grade_saturation = 1.12         # grade: saturation multiplier
grade_vignette = 0.28           # grade: how dark the corners get
grade_shadow_tint = -0.035 0.012 0.045      # grade: added to the shadows (teal)
grade_highlight_tint = 0.06 0.015 -0.05     # grade: added to the highlights (orange)
blur_start = 0.35               # peripheral blur starts at this screen radius (0 centre, 1 edge)
blur_length = 0.06              # peripheral blur streak length at full speed (screen units)
shake_hz = 9                    # camera shake frequency
shadow = 0.55                   # how dark the car's shadow on the level is, 0 (off)..1
sun = 0.35 1 0.25               # direction towards the sun for the car's shadow (world space)
dof = 1                         # depth of field 0..1: the distance softens, the car and the road ahead stay sharp
dof_focus_m = 0                 # depth of field: sharp out to this far from the camera; 0 follows the level's detail (soft before LOD 2)
dof_range_m = 25                # depth of field: metres past the focus to full blur
dof_radius_px = 8               # depth of field: full blur radius, pixels at a 1080-pixel-tall frame

[hud]
enabled = true                  # the dashboard; H toggles it
design = crates/splat-hud/designs/porsche-992-gt3rs.hud   # a .hud file (edit, then reload) or a built-in name: porsche-992-gt3rs, turbo-sport

[game]
start_mode = practice           # practice | race
countdown_seconds = 3

[console]
enabled = true
stdin = true                    # read commands from standard input
