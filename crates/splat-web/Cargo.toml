[package]
name = "splat-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 AND MIT"
description = "Browser build of Splat Racer: the engine and WebGPU renderer as WebAssembly, drawn into a canvas each animation frame."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
splat-engine = { path = "../splat-engine" }
splat-car = { path = "../splat-car" }
splat-hud = { path = "../splat-hud" }
splat-render = { path = "../splat-render" }
wgpu = "30"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console", "Performance"] }

[workspace]
