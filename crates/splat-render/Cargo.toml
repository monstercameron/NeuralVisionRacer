[package]
name = "splat-render"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 AND MIT"
description = "wgpu pipeline for the Splat Racer gsplat port: bind-group layouts and shader modules from splat-wgsl."

[dependencies]
splat-wgsl = { path = "../splat-wgsl" }
bytemuck = "1"
wgpu = "30"
pollster = "0.4"
# SOG bundle loading: `zip` reads the store-only archive, `image` decodes its WebP textures (pure Rust).
serde_json = "1"
zip = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["webp", "png", "hdr"] }

[workspace]

